<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>App 1%</title>
<meta name="description" content="Un 1% mejor cada día: gym, hábitos, dejar algo y tu móvil, con Míster.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="App 1%">
<meta name="theme-color" content="#101113">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="iconos/icon-180.png"><link rel="icon" type="image/png" href="iconos/icon-192.png">
<link rel="stylesheet" href="fuentes/fuentes.css">
<style>body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#101113;color:#F2F2EE}img{max-width:100%}[hidden]{display:none!important}

/* Layout: la app a pantalla completa en el móvil; en el ordenador, un móvil centrado. Los colores de la app viven en .app: oscuro por defecto, claro y 6 colores. */
:root{
  --page:#0B0C0D; --frame:#2C3035; --cap:#8A8F98;
  --display:Anton, Impact, "Arial Narrow", sans-serif;
  --body:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --page:#E9E9E4; --frame:#C9CBC6; --cap:#4A4C50; color-scheme:light } }
:root[data-theme="light"]{ --page:#E9E9E4; --frame:#C9CBC6; --cap:#4A4C50; color-scheme:light }

html,body{height:100%}
body{margin:0;background:var(--page);color:var(--cap);font-family:var(--body)}

.app{
  --fd:#FFD60A; --fl:#FFD60A; --od:#101113; --ol:#101113; --td:#FFD60A; --tl:#0F1012; --sd:rgba(255,214,10,.2); --sl:rgba(255,214,10,.5);
  --bg:#101113; --caja:#191B1E; --caja2:#23262A; --text:#F2F2EE; --text2:#A6AAB2; --text3:#8A8F98;
  --borde:1px solid #2C3035; --fina:1px solid #2C3035; --off:#33373D; --cta:#F2F2EE; --onCta:#101113; --hatch:#6A6E76;
  --acc:var(--fd); --onAcc:var(--od); --accTxt:var(--td); --soft:var(--sd); --hlBg:transparent; --hlFg:var(--td); --lleno:1px solid var(--fd);
  color-scheme:dark;
}
.app[data-tema="claro"]{
  --bg:#FFFFFF; --caja:#FFFFFF; --caja2:#F3F3F0; --text:#0F1012; --text2:#4A4C50; --text3:#63666B;
  --borde:2px solid #0F1012; --fina:1px solid #C9CBC6; --off:#E8E8E4; --cta:#0F1012; --onCta:#FFFFFF; --hatch:#8A8D92;
  --acc:var(--fl); --onAcc:var(--ol); --accTxt:var(--tl); --soft:var(--sl); --hlBg:var(--fl); --hlFg:var(--ol); --lleno:2px solid #0F1012;
  color-scheme:light;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .app[data-tema="auto"]{
  --bg:#FFFFFF; --caja:#FFFFFF; --caja2:#F3F3F0; --text:#0F1012; --text2:#4A4C50; --text3:#63666B;
  --borde:2px solid #0F1012; --fina:1px solid #C9CBC6; --off:#E8E8E4; --cta:#0F1012; --onCta:#FFFFFF; --hatch:#8A8D92;
  --acc:var(--fl); --onAcc:var(--ol); --accTxt:var(--tl); --soft:var(--sl); --hlBg:var(--fl); --hlFg:var(--ol); --lleno:2px solid #0F1012;
  color-scheme:light;
} }
:root[data-theme="light"] .app[data-tema="auto"]{
  --bg:#FFFFFF; --caja:#FFFFFF; --caja2:#F3F3F0; --text:#0F1012; --text2:#4A4C50; --text3:#63666B;
  --borde:2px solid #0F1012; --fina:1px solid #C9CBC6; --off:#E8E8E4; --cta:#0F1012; --onCta:#FFFFFF; --hatch:#8A8D92;
  --acc:var(--fl); --onAcc:var(--ol); --accTxt:var(--tl); --soft:var(--sl); --hlBg:var(--fl); --hlFg:var(--ol); --lleno:2px solid #0F1012;
  color-scheme:light;
}
.app[data-color="azul"]{ --fd:#2563EB; --fl:#2563EB; --od:#FFFFFF; --ol:#FFFFFF; --td:#6EA0FF; --tl:#2563EB; --sd:rgba(37,99,235,.26); --sl:rgba(37,99,235,.14) }
.app[data-color="verde"]{ --fd:#22C55E; --fl:#22C55E; --od:#0F1012; --ol:#0F1012; --td:#4ADE80; --tl:#15803D; --sd:rgba(34,197,94,.2); --sl:rgba(34,197,94,.24) }
.app[data-color="naranja"]{ --fd:#FF6B1A; --fl:#FF6B1A; --od:#0F1012; --ol:#0F1012; --td:#FF8A47; --tl:#C2410C; --sd:rgba(255,107,26,.2); --sl:rgba(255,107,26,.2) }
.app[data-color="morado"]{ --fd:#6D4AFF; --fl:#6D4AFF; --od:#FFFFFF; --ol:#FFFFFF; --td:#A78BFA; --tl:#6D4AFF; --sd:rgba(109,74,255,.28); --sl:rgba(109,74,255,.14) }
.app[data-color="byn"]{ --fd:#F2F2EE; --fl:#0F1012; --od:#101113; --ol:#FFFFFF; --td:#F2F2EE; --tl:#0F1012; --sd:rgba(242,242,238,.14); --sl:rgba(15,16,18,.08) }

.app{position:relative;display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;padding-block:20px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.cap{display:none}
@media (min-width:600px){
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;padding-block:20px}
  .app{width:390px;height:min(844px,calc(100% - 40px));border-radius:44px;border:1px solid var(--frame);box-shadow:0 30px 80px rgba(0,0,0,.28)}
  .screen{padding-top:40px}
  .cap{display:block;margin:0;font-size:13px;color:var(--cap)}
}

.app button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app :focus-visible{outline:2px solid var(--accTxt);outline-offset:2px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.p2{margin:0;color:var(--text2);line-height:1.45}
.lg{font-size:17px}
.nota{margin:0;font-size:13px;line-height:1.45;color:var(--text3)}
.c{text-align:center}
.h1{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.92;font-size:56px;letter-spacing:.005em;text-wrap:balance}
.h1.xl{font-size:64px}
.h1.q{font-size:40px;line-height:.95}
.h1.m{font-size:44px;line-height:1}
.hl{padding:0 6px;background:linear-gradient(var(--hlBg),var(--hlBg)) 0 58%/100% .9em no-repeat;color:var(--hlFg);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.num{font-family:var(--display);font-weight:400;line-height:1}
.acc{color:var(--accTxt)}
.box{border:var(--borde);background:var(--caja);border-radius:12px}
.pad{padding:14px 16px}
.fill{flex:1}
.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px}
.sec{display:flex;flex-direction:column;gap:8px}
.grid2,.grid3,.grid4,.grid5,.grid7{display:grid;gap:8px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid5{grid-template-columns:repeat(5,minmax(0,1fr))}
.grid7{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

.mister{display:flex;gap:10px;align-items:flex-start}
.mister p{margin:0;font-size:15px;line-height:1.4;font-weight:600}
.tag{flex-shrink:0;margin-top:1px;padding:3px 7px;border-radius:4px;background:var(--acc);color:var(--onAcc);font-family:var(--display);font-size:13px;letter-spacing:.06em}

.cta{position:relative;overflow:hidden;width:100%;min-height:64px;box-sizing:border-box;padding:0 20px;border:none;border-radius:12px;background:var(--cta);color:var(--onCta) !important;display:flex;align-items:center;justify-content:space-between;gap:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cta-t{position:relative;font-family:var(--display);font-size:28px;letter-spacing:.02em;text-align:left}
.cta .small{position:relative;font-size:14px;font-weight:800}
.cta svg{position:relative}
.cta.done{background:var(--acc);color:var(--onAcc) !important;border:var(--lleno)}
.cta.ghost{background:transparent;color:var(--text) !important;border:var(--lleno)}
.cta.sm .cta-t{font-size:22px}
.link{border:none;background:none;color:var(--text2) !important;font-weight:700;font-size:14px;text-decoration:underline;min-height:44px}

.obtop{display:flex;align-items:center;gap:10px}
.ib{width:44px;height:44px;margin-left:-12px;border:none;background:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar{flex:1;height:6px;border-radius:3px;background:var(--off);overflow:hidden}
.bar span{display:block;height:100%;background:var(--acc)}
.logo{width:72px;height:72px;border-radius:16px;background:var(--acc);color:var(--onAcc);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;margin-top:16px}

.opt{min-height:48px;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:var(--borde);background:var(--caja);text-align:left;font-weight:700;font-size:14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.opt.on{background:var(--acc);color:var(--onAcc) !important;border:var(--lleno)}
.opt.c{align-items:center;justify-content:center;text-align:center}
.opt.big{height:112px}
.opt.big .num{font-size:42px}
.opt.mid{height:80px}
.opt .t{font-size:15px;line-height:1.2}
.opt .ar{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.1em}
.opt.calm{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;font-size:16px;min-height:56px}
.opt.calm.on{background:var(--caja2);color:var(--text) !important;border:2px solid var(--text)}
.dot{width:20px;height:20px;box-sizing:border-box;border-radius:10px;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.on .dot{border-color:var(--text)}
.on .dot::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--text)}
.opt .q{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.opt .ej{font-weight:500;line-height:1.35}

.avatar{width:44px;height:44px;border-radius:22px;border:var(--borde);background:var(--caja);font-weight:800;font-size:16px;overflow:hidden;padding:0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.xl{width:60px;height:60px;border-radius:30px;font-size:24px;border:var(--lleno)}
.perfil-foto{position:relative;cursor:pointer;flex-shrink:0;display:block}
.perfil-foto input{position:absolute;width:1px;height:1px;opacity:0}
.perfil-foto .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:12px;background:var(--acc);color:var(--onAcc,#101113);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:var(--borde);border-radius:12px;overflow:hidden}
.score>div{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-right:var(--borde);min-width:0}
.score>div:last-child{border-right:none}
.score .num{font-size:36px}
.score.s .num{font-size:24px}
.score.s>div{padding:12px}
.score .sm{font-size:13px;color:var(--text2)}

.tile{position:relative;overflow:hidden;height:96px;box-sizing:border-box;padding:12px;border-radius:12px;border:var(--borde);background:var(--caja);display:flex;flex-direction:column;justify-content:space-between;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.on{background:var(--acc);color:var(--onAcc) !important;border:var(--lleno)}
.tile .tt{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.1em}
.tile .bt{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.tile .bc{position:relative;display:flex;flex-direction:column;gap:2px}
.tile .num{font-size:30px}
.tile .sm{font-size:13px;font-weight:700}
.tile .v{font-size:16px;font-weight:700;color:var(--text2)}
.tile .v2{font-size:14px;font-weight:700}
.tile .s2{font-size:13px;color:var(--text2)}
.hint{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--text3)}
.holdfill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--soft);transition:height .15s}
.holding .holdfill{height:100%;transition:height .7s linear}
.cta .holdfill{background:var(--acc);opacity:.35}
.soft57{position:absolute;left:0;right:0;bottom:0;height:57%;background:var(--soft)}
.hatch{background-image:repeating-linear-gradient(45deg,var(--hatch) 0 2px,transparent 2px 7px)}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px}

.tabbar{flex:none;display:flex;justify-content:space-around;align-items:center;height:64px;border-top:var(--borde);background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.opt.tiny{padding:8px 4px;font-size:12.5px}
.tb{width:78px;height:54px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--text3) !important}
.tb[aria-current="page"]{color:var(--text) !important}
.tb[aria-current="page"] svg{stroke:var(--accTxt)}
.toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:5;padding:12px 14px;border-radius:12px;background:var(--cta);color:var(--onCta);font-weight:700;font-size:14px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.notab .toast{bottom:16px}

.bubble{margin:0;max-width:85%;padding:12px 14px;border-radius:4px 14px 14px 14px;border:var(--borde);background:var(--caja);line-height:1.4;align-self:flex-start}
.bubble.me{align-self:flex-end;border-radius:14px 4px 14px 14px;background:var(--acc);color:var(--onAcc);border:none;font-weight:700}
.day{align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:var(--borde);background:var(--caja);font-weight:700;font-size:14px}
.chip.on{background:var(--acc);color:var(--onAcc) !important;border:var(--lleno)}

.input{width:100%;box-sizing:border-box;height:56px;padding:0 16px;border-radius:12px;border:var(--lleno);background:var(--caja);color:var(--text);font-family:var(--body);font-size:17px}
.input.big{height:64px;font-family:var(--display);font-size:30px}
textarea.input{height:76px;padding:12px 16px;resize:none;line-height:1.4}
.input:focus{outline:2px solid var(--accTxt);outline-offset:1px}

.lrow{display:flex;align-items:center;gap:12px;min-height:66px;border-bottom:var(--fina);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;padding:0}
.thumb{width:48px;height:48px;flex-shrink:0;border-radius:10px;background:var(--caja2);display:flex;align-items:center;justify-content:center;color:var(--accTxt)}
.sq{width:44px;height:44px;flex-shrink:0;border-radius:10px;border:var(--borde);background:var(--caja);display:flex;align-items:center;justify-content:center}
.list{border-radius:12px;border:var(--borde);background:var(--caja);overflow:hidden}
.list .it{width:100%;min-height:48px;box-sizing:border-box;padding:0 14px;border:none;border-bottom:var(--fina);background:transparent;display:flex;align-items:center;gap:10px;text-align:left}
.list .it:last-child{border-bottom:none}
.list .it .l{flex:1;font-size:15px;font-weight:600}
.list .it .v{font-size:14px;color:var(--text2)}

.mbar{height:10px;border-radius:5px;background:var(--off);overflow:hidden}
.mbar span{display:block;height:100%;background:var(--accTxt)}
.cell{height:40px;box-sizing:border-box;border-radius:8px;border:var(--borde);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text3)}
.cell.si{background:var(--acc);color:var(--onAcc);border:var(--lleno)}
.cell.no{background:var(--caja)}
.cell.hoy{outline:2px solid var(--text);outline-offset:1px}
.cell.fut{background:transparent;opacity:.6}
.cell.vac{border:none}
.wk{display:flex;align-items:flex-end;gap:12px;height:96px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.wk span.b{width:100%;border-radius:6px 6px 2px 2px;background:var(--accTxt)}
.wk span.b.lo{background:var(--off)}
.serie{display:grid;grid-template-columns:70px 1fr 1fr 48px;align-items:center;gap:8px;min-height:56px;box-sizing:border-box;padding:0 6px 0 14px;border-radius:12px;border:var(--borde);background:var(--caja);text-align:left;width:100%}
.serie.on{background:var(--acc);color:var(--onAcc) !important;border:var(--lleno)}
.serie .num{font-size:24px}
.ck{width:36px;height:36px;border-radius:8px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;justify-self:end}
.story{align-self:center;width:min(100%,300px);aspect-ratio:9/16;max-width:100%;box-sizing:border-box;border-radius:20px;background:#101113;color:#F2F2EE;padding:24px 22px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.story .ylw{color:var(--td)}
.story .mk{width:44px;height:44px;border-radius:10px;background:var(--fd);color:var(--od);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px}
.cars{display:flex;gap:4px;color:var(--accTxt)}
.half{width:14px;overflow:hidden;display:inline-flex}
figure{margin:0}

.match{border:var(--lleno);background:var(--caja);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;box-sizing:border-box}
.match .mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.match .who{display:flex;flex-direction:column;gap:2px}
.match .who.r{align-items:flex-end;text-align:right}
.match .sc{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:.02em}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--accTxt);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.mis{display:flex;align-items:center;gap:12px;min-height:58px;border:none;border-top:var(--fina);padding:6px 0;width:100%;background:none;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mis .bx{position:relative;overflow:hidden;width:36px;height:36px;flex-shrink:0;box-sizing:border-box;border-radius:9px;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center}
.mis .bx svg{position:relative}
.mis.on .bx{background:var(--acc);border:var(--lleno);color:var(--onAcc)}
.mis .holdfill{background:var(--acc);opacity:.55}
.seg{display:grid;gap:4px}
.seg span{height:6px;border-radius:3px;background:var(--off)}
.seg span.on{background:var(--acc)}
.chipres{justify-self:end;font-size:12px;font-weight:800;letter-spacing:.08em;padding:5px 8px;border-radius:6px;white-space:nowrap}
.chipres.tu{background:var(--acc);color:var(--onAcc)}
.chipres.su{background:var(--off);color:var(--text)}
.chipres.eq{border:var(--borde);color:var(--text2)}
.jug{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 86px;align-items:center;gap:6px;min-height:48px;border-bottom:var(--fina);font-size:14px}
.jug .v{font-family:var(--display);font-size:18px;text-align:center}
.jug.oculta{opacity:.35}
.overlay{position:absolute;inset:0;z-index:8;background:rgba(10,11,12,.74);display:flex;align-items:center;justify-content:center;padding:20px}
.cele{position:relative;width:100%;max-width:340px;box-sizing:border-box;border-radius:20px;background:var(--bg);border:var(--lleno);padding:22px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}

/* ===== Beta 3.3 · capa de diseño =====
   Misma identidad (grafito, amarillo, Anton + Inter). Lo nuevo:
   curvas de movimiento propias, tacto al pulsar en todo lo que se toca, textos de 12 px como mínimo,
   números que no bailan, barra de abajo de cristal flotante (iOS 26) y una ficha de ejercicio con escenario. */
.app{
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  --cristal:color-mix(in srgb, var(--bg) 66%, transparent);
  --brillo:color-mix(in srgb, #FFFFFF 9%, transparent);

}

@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .app[data-tema="auto"]{ --brillo:rgba(255,255,255,.7); --sombraFlota:0 10px 30px rgba(15,16,18,.14), 0 2px 6px rgba(15,16,18,.08) } }
:root[data-theme="light"] .app[data-tema="auto"]{ --brillo:rgba(255,255,255,.7); --sombraFlota:0 10px 30px rgba(15,16,18,.14), 0 2px 6px rgba(15,16,18,.08) }

/* Letra: nada por debajo de 12 px, cifras de ancho fijo, párrafos sin viudas */

/* Nada se aplasta: los bloques de cada pantalla mantienen su alto */
.screen>*{flex-shrink:0}

/* Tacto: todo lo que se toca responde, con una curva rápida y sin "transition: all" */

  transition:transform .16s var(--ease-out), background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease}
.tile:active,.wid:active,.fcard:active,.lrow>button.row:active,.demo:active{transform:scale(.98)}

  .chip:not(.on):hover,.opt:not(.on):hover,.tile:not(.on):hover,.fcard:hover{border-color:var(--text3)}

}

/* Entradas con la curva propia; las salidas, más rápidas */

/* ===== Cristal: fondo vivo detrás y piezas esmeriladas encima ===== */
.app{isolation:isolate;overflow:clip}
/* el aura entra por la izquierda y cambia de color con la hora del día */
.app{--au2:#5B8CFF;--au3:#B45BFF;--auF:38%;--auG:30%}
.app[data-franja="manana"]{--au2:#FFA42B;--au3:#EC407A;--auF:72%;--auG:56%}
.app[data-franja="mediodia"]{--au2:#FFC857;--au3:#4FD1A5;--auF:66%;--auG:50%}
.app[data-franja="tarde"]{--au2:#6D5CFF;--au3:#29B6F6;--auF:76%;--auG:60%}
.app[data-franja="noche"]{--au2:#3E4AA8;--au3:#1A7C7A;--auF:64%;--auG:46%}
/* OJO: el pseudo mide 150% de la pantalla (inset -25%), así que un 17% suyo
   es el borde izquierdo de verdad. Con valores más bajos el aura se quedaba fuera. */
.app::before{content:"";position:absolute;inset:-25%;z-index:0;pointer-events:none;
  transition:background 1.6s linear;
  background:
    radial-gradient(34% 30% at 17% 27%, color-mix(in srgb,var(--acc) 70%,transparent), transparent 72%),
    radial-gradient(32% 32% at 13% 50%, color-mix(in srgb,var(--au2) var(--auF),transparent), transparent 72%),
    radial-gradient(34% 30% at 18% 73%, color-mix(in srgb,var(--au3) var(--auG),transparent), transparent 72%),
    radial-gradient(24% 22% at 22% 88%, color-mix(in srgb,var(--acc) 30%,transparent), transparent 72%);
  filter:blur(34px);animation:aurora 26s ease-in-out infinite alternate;will-change:transform}
.app[data-tema="claro"]::before{opacity:.62}
@media (prefers-color-scheme: light){ .app[data-tema="auto"]::before{opacity:.62} }
/* punto "en directo" de Hoy */
.endirecto{position:relative;width:8px;height:8px;flex:0 0 auto;display:inline-block}
.endirecto::before,.endirecto::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--acc)}
.endirecto::before{animation:latido 2.2s ease-out infinite}
@keyframes latido{0%{transform:scale(1);opacity:.6}70%{transform:scale(2.6);opacity:0}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){ .endirecto::before{animation:none;opacity:.3} }
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(1.5%,-3%,0) scale(1.05)}100%{transform:translate3d(.5%,3%,0) scale(1.02)}}
.app .screen{position:relative;z-index:1;background:transparent}
.box{background:color-mix(in srgb,var(--caja) 52%,transparent);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);box-shadow:inset 0 1px 0 var(--brillo),0 6px 22px rgba(0,0,0,.10)}
.app[data-tema="claro"] .box{background:color-mix(in srgb,var(--caja) 64%,transparent)}
.fila{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.h1.frase{font-size:38px;line-height:1.02;text-transform:none;letter-spacing:.002em;text-wrap:balance}

/* barra de abajo: borde de luz arriba-izquierda */
.tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.18));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tabbar{--cristal:color-mix(in srgb,var(--bg) 52%,transparent)}
/* hojas que suben: cristal grueso */
.sheet{position:relative;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--brillo),0 -10px 40px rgba(0,0,0,.25)}
.overlay{background:rgba(10,11,12,.55);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}
.toast{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}

@media (prefers-reduced-transparency: reduce){
  .app::before{display:none} .box{background:var(--caja);-webkit-backdrop-filter:none;backdrop-filter:none} .fila{-webkit-backdrop-filter:none;backdrop-filter:none} .sheet{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none} .overlay{background:rgba(10,11,12,.8)} }
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .sheet{background:var(--bg)} }

/* =========================================================
   Splash de entrada · 1%
   Letra Anton (la de la marca) convertida a dibujo, inclinada hacia delante.
   Entrada suave; salida como un cristal esmerilado que se aclara.
   Duración total 2,6 s. Se pinta antes que la app y se quita sola. Minimalista: un punto, el logo y el eslogan.
   ========================================================= */
.spl{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#080808;overflow:hidden;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent;
  animation:splOut 2.6s linear both}
@media (min-width:600px){
  .spl{inset:0;margin:auto;left:0;right:0;top:0;width:390px;height:min(844px,calc(100% - 40px));min-height:0;border-radius:44px}
}
.spl.fin{animation:splSkip .45s ease forwards!important}
.spl-mark{position:relative;width:min(42%,170px);aspect-ratio:2675/1785;display:grid;place-items:center}
.spl-logo{position:relative;width:100%;height:100%;overflow:visible;display:block;
  animation:splIn 1s cubic-bezier(.22,.7,.2,1) .55s both, splLeave .7s cubic-bezier(.45,0,.9,.6) 1.8s forwards;will-change:transform,opacity,filter}
.spl-spark{transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 120px rgba(255,214,10,.9));
  animation:splSpark .7s cubic-bezier(.2,.9,.3,1) 1.05s both}
.spl-dot{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;
  box-shadow:0 0 18px 4px rgba(255,255,255,.55);opacity:0;animation:splDot .9s cubic-bezier(.3,.7,.3,1) .15s both;will-change:transform,opacity}
.spl-glow{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;margin:-95% 0 0 -95%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.11) 0%,rgba(255,236,150,.05) 30%,rgba(255,214,10,.025) 55%,rgba(255,214,10,.008) 80%,transparent 100%);
  opacity:0;animation:splGlow 2.6s ease-out both;will-change:transform,opacity}
.spl-tag{position:absolute;left:50%;top:100%;margin-top:clamp(18px,5.5vw,24px);transform:translateX(-50%);white-space:nowrap;text-align:center;
  font:600 clamp(8.5px,2.7vw,10.5px)/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.4em;text-indent:.4em;color:rgba(255,255,255,.62);
  opacity:0;animation:splTag .8s cubic-bezier(.2,.7,.2,1) 1.15s both, splLeaveT .6s ease-in 1.8s forwards;will-change:transform,opacity}
.spl-tag b{font-weight:800;color:#fff}

/* salida: el negro se vuelve cristal esmerilado y se aclara hasta dejar ver la app */
@keyframes splOut{
  0%,68%{background-color:rgba(8,8,8,1);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);opacity:1;visibility:visible}
  80%{background-color:rgba(8,8,8,.6);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
  92%{background-color:rgba(8,8,8,.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  99.9%{background-color:rgba(8,8,8,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);opacity:1;visibility:visible}
  100%{opacity:0;visibility:hidden}
}
@keyframes splOutRM{0%,80%{opacity:1;visibility:visible}99.9%{opacity:0;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes splSkip{to{opacity:0;visibility:hidden}}
@keyframes splDot{0%{opacity:0;transform:scale(.3)}22%{opacity:1;transform:scale(1)}58%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(5)}}
@keyframes splGlow{0%,20%{opacity:0;transform:scale(.25)}36%{opacity:.95;transform:scale(1)}55%{opacity:.5;transform:scale(1.06)}72%{opacity:.4;transform:scale(1.08)}100%{opacity:0;transform:scale(1.1)}}
@keyframes splIn{0%{opacity:0;transform:scale(.88);filter:blur(14px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes splLeave{0%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(1.06);filter:blur(10px)}}
@keyframes splSpark{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes splTag{0%{opacity:0;transform:translateX(-50%) translateY(10px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes splLeaveT{0%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .spl{animation:splOutRM 1.7s linear both}
  .spl-dot,.spl-glow,  .spl-logo{animation:splFade .4s ease .1s both, splLeaveT .4s ease-in 1.2s forwards;filter:none}
  .spl-spark{animation:none}
  .spl-tag{animation:splFadeT .4s ease .3s both, splLeaveT .4s ease-in 1.2s forwards}
}
@keyframes splFade{from{opacity:0}to{opacity:1}}
@keyframes splFadeT{from{opacity:0;transform:translateX(-50%)}to{opacity:1;transform:translateX(-50%)}}

.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-st{padding:11px 12px;border-radius:12px;background:var(--caja2);border:var(--borde);display:flex;flex-direction:column;gap:4px;min-width:0}
.rp-st .num{font-size:25px;line-height:1.05;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rp-st .num.acc{color:var(--accTxt)}
.rp-st .k{font-size:12.5px;font-weight:700;color:var(--text2);line-height:1.25}
.rp-st .est{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.rp-hito{display:flex;flex-direction:column;gap:7px}
.rp-hito .row{font-size:13px;font-weight:700;gap:8px}
.rp-hito .row span:last-child{color:var(--text2);font-weight:600;text-align:right}
.rp-eq{display:flex;flex-wrap:wrap;gap:6px}
.rp-eq span{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;border:var(--borde);color:var(--text3)}
.rp-eq .on{border:var(--lleno);color:var(--text);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.rp-eq .on::before{content:"✓ ";color:var(--accTxt)}
.rp-eq .prox{border-style:dashed}
.rp-recuerdo{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--caja2);font-size:15px;font-weight:700;line-height:1.35}
.rp-li{font-size:14px;font-weight:700;padding:6px 0;border-top:var(--fina)}
.rp-li .num{font-size:18px}
.rp-donde{font-size:13px;color:var(--text2)}
.rp-donde summary{cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px;list-style:none;min-height:32px;display:flex;align-items:center}
.rp-donde summary::-webkit-details-marker{display:none}
.rp-donde p{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:var(--caja2);line-height:1.45}
.rp-calc{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--text3)}
.rp-calc b{color:var(--text2)}
.rp-calc .link{min-height:36px;font-size:13px;flex-shrink:0}
.rp-afinar{padding:12px 14px;text-align:left;width:100%;border:var(--lleno)}
.rp-afinar span span{font-size:13px;color:var(--text2)}
.rp-res{font-size:13px;font-weight:700;color:var(--accTxt);font-variant-numeric:tabular-nums}
.cell.libre{background:transparent;border-style:dashed;opacity:.45}
.mini-chip{min-height:32px !important;padding:0 10px !important;font-size:12.5px !important;display:inline-flex;align-items:center;gap:6px}
.mini-chip i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* el tarro de cosas buenas */
.tarro{position:relative;align-self:center;width:min(70%,230px);padding-top:14px}
.tarro .tapa{position:absolute;top:0;left:16%;right:16%;height:16px;border-radius:6px 6px 3px 3px;background:var(--caja2);border:var(--borde)}
.tarro .cristal{position:relative;min-height:170px;max-height:240px;border-radius:22px 22px 30px 30px;padding:14px 12px;overflow:hidden;
  display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:5px;
  border:1px solid color-mix(in srgb,var(--text) 22%,transparent);
  background:linear-gradient(115deg,color-mix(in srgb,var(--text) 10%,transparent),transparent 40%),color-mix(in srgb,var(--caja) 50%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset -6px 0 14px rgba(255,255,255,.04)}
.tarro .cristal i{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.25),inset 0 2px 2px rgba(255,255,255,.35)}
.tarro .cristal i.cae{animation:tarroCae .7s cubic-bezier(.3,1.3,.5,1) both}
.tarro .vacio{align-self:center;font-size:13px;font-weight:700;color:var(--text3);text-align:center}
@keyframes tarroCae{from{transform:translateY(-140px);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .tarro .cristal i.cae{animation:none} }
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .tarro .cristal{background:var(--caja2)} }

/* versión instalada: toda la pantalla, de borde a borde, sin zoom */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px}
.app{--it:max(env(safe-area-inset-top,0px),var(--itExtra,0px));--ib:max(env(safe-area-inset-bottom,0px),var(--ibExtra,0px))}
@media (max-width:599px){
  body{padding:0;display:block}
  /* pegada a los cuatro bordes de lo que se ve de verdad: la barra de abajo nunca queda cortada */
  .app{position:fixed;top:0;left:0;right:0;bottom:0;width:auto;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none}
  /* instalada: la app llega hasta el borde de abajo de la pantalla, aunque iOS diga que se ve menos */
  html.inst .app{bottom:auto;height:var(--alto,100%)}
  html,body{background:var(--fondoApp,#101113)}
  .cap{display:none}
}
.screen{padding-top:calc(var(--it) + 20px)}
.tabbar{bottom:max(10px,var(--ib))}
.barra-cta{bottom:calc(max(10px,var(--ib)) + 74px)}
.app:not(.notab) .screen{padding-bottom:calc(var(--ib) + 104px)}
.app.conbarra .screen{padding-bottom:calc(var(--ib) + 172px)}
.app.condesc .screen{padding-bottom:calc(var(--ib) + 176px)}
.app.notab .screen{padding-bottom:calc(var(--ib) + 28px)}
.app:has(.wrap) .screen{padding:0}
.toast{bottom:calc(var(--ib) + 86px)}
.app.conbarra .toast{bottom:calc(var(--ib) + 150px)}
.app.condesc .toast{bottom:calc(var(--ib) + 156px)}
.app:not(.notab)::after{height:calc(var(--ib) + 120px)}
.sheet{padding-bottom:calc(var(--ib) + 22px)}

<script>(function(){ /* app instalada: pantalla entera hasta abajo. Si iOS dice que se ve menos que la pantalla (pasa en algunos iPhone), la app se alarga hasta el borde y la barra sube lo que falte para no quedar cortada. */
  var st=window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); if(!st) return;
  var r=document.documentElement; r.classList.add('inst');

  var W=Math.min(screen.width,screen.height), H=Math.max(screen.width,screen.height);
  if(W===390 && H===844){ var fija=function(){ var vert=window.innerHeight>=window.innerWidth; r.style.setProperty('--alto', (vert?844:390)+'px'); r.style.setProperty('--itExtra', vert?'47px':'0px'); r.style.setProperty('--ibExtra', vert?'34px':'21px'); };
    fija(); window.addEventListener('resize', fija); window.addEventListener('orientationchange', function(){ setTimeout(fija, 300); }); window.addEventListener('pageshow', fija); return; }
  function mide(){ var vert=window.innerHeight>=window.innerWidth, alto=vert?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width), ext=Math.max(0, alto-window.innerHeight);
    if(ext>140){ alto=window.innerHeight; ext=0; }
    r.style.setProperty('--alto', alto+'px'); r.style.setProperty('--ibExtra', (ext?ext+18:0)+'px'); }
  mide(); window.addEventListener('resize', mide); window.addEventListener('orientationchange', function(){ setTimeout(mide, 300); }); window.addEventListener('pageshow', mide); })();</script>
